[project]
name = "tomodachi-macrogen"
version = "1.0.1"
description = "Generate SwiCC macro scripts for Tomodachi Life face paint automation."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "Pillow>=10.0",
  "PyQt6>=6.7",
  "pyserial>=3.5",
  "python-i18n>=0.3.9",
  "tqdm>=4.67",
]

[project.scripts]
tomodachi-macrogen = "tomodachi_macrogen:main"
tomodachi-gui = "tomodachi_gui:main"
tomodachi-build-gui = "tomodachi_build_gui:main"
tomodachi-check-version = "tomodachi_check_version:main"
tomodachi-clean = "tomodachi_macrogen:clean_main"

[dependency-groups]
build = [
  "pyinstaller>=6.20",
]
dev = [
  "git-cliff>=2.13.1",
  "pyupgrade>=3.20.0",
  "ruff>=0.11.0",
]
test = [
  "pytest>=8.3",
  "pytest-xdist>=3.6",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
  "tomodachi_macrogen",
  "tomodachi_gui",
  "tomodachi_build_gui",
  "tomodachi_check_version",
  "swicc_runner",
]
packages = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.git-cliff.changelog]
header = """
# Changelog

All notable changes to this project are generated from Git history by git-cliff.

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}
{% for group, commits in commits | group_by(attribute="group") -%}
### {{ group | striptags | trim }}
{% for commit in commits -%}
- {{ commit.message | trim | split(pat="\n") | first | upper_first }}
{% endfor %}

{% endfor -%}
"""
footer = """
<!-- generated by git-cliff -->
"""
trim = true
render_always = true

[tool.git-cliff.git]
conventional_commits = true
filter_unconventional = false
require_conventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
fail_on_unmatched_commit = false
tag_pattern = "v[0-9].*"
topo_order = false
topo_order_commits = true
sort_commits = "newest"
recurse_submodules = false
commit_preprocessors = [
  { pattern = "\\((#([0-9]+))\\)", replace = "([#${3}](https://github.com/txfs19260817/tomodachi-macrogen/issues/${3}))" },
]
commit_parsers = [
  { message = "^[Ff]eat", group = "<!-- 0 -->Features" },
  { message = "^[Aa]dd|^[Ii]ntroduce|^[Ss]upport|^[Ee]nable|^[Ii]ntegrate", group = "<!-- 0 -->Features" },
  { message = "^[Ff]ix|^[Rr]epair|^[Cc]orrect", group = "<!-- 1 -->Fixes" },
  { message = "^[Dd]oc|^[Rr]eadme|^[Pp]repare .*documentation", group = "<!-- 2 -->Documentation" },
  { message = "^[Rr]efactor|^[Mm]odernize|^[Ss]implify|^[Rr]emove|^[Cc]lean|^[Mm]ove maintenance", group = "<!-- 3 -->Maintenance" },
  { message = "^[Tt]est", group = "<!-- 4 -->Tests" },
  { message = "^[Bb]uild|^[Cc][Ii]|^[Ww]orkflow|^[Rr]elease|^[Vv]ersion|^[Tt]ag|^[Uu]pdate .*workflow|^[Uu]pdate .*build", group = "<!-- 5 -->Build and Release" },
  { message = ".*", group = "<!-- 6 -->Changes" },
]
