[project]
name = "tomodachi-macrogen"
version = "1.0.3"
description = "Generate SwiCC macro scripts for Tomodachi Life face paint automation."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "Pillow>=10.0",
  "PyQt6>=6.7",
  "pyserial>=3.5",
  "python-i18n>=0.3.9",
  "tqdm>=4.67",
]

[project.scripts]
tomodachi-macrogen = "tomodachi_macrogen:main"
tomodachi-gui = "tomodachi_gui:main"
tomodachi-build-gui = "tomodachi_build_gui:main"
tomodachi-check-version = "tomodachi_check_version:main"
tomodachi-clean = "tomodachi_macrogen:clean_main"

[dependency-groups]
benchmark = [
  "pytest-benchmark>=5.2.3",
]
build = [
  "pyinstaller>=6.20",
]
dev = [
  "commitizen>=4.10",
  "git-cliff>=2.13.1",
  "pyupgrade>=3.20.0",
  "ruff>=0.11.0",
]
test = [
  "pytest>=8.3",
  "pytest-xdist>=3.6",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
  "tomodachi_macrogen",
  "tomodachi_gui",
  "tomodachi_build_gui",
  "tomodachi_check_version",
  "swicc_runner",
]
packages = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_provider = "pep621"
version_scheme = "semver"
update_changelog_on_bump = false

[tool.git-cliff.changelog]
header = """
# Changelog

All notable changes to this project are generated from Git history by git-cliff.

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}
{% for group, commits in commits | group_by(attribute="group") -%}
### {{ group | striptags | trim }}
{% for commit in commits -%}
- {{ commit.message | trim | split(pat="\n") | first | upper_first }}
{% endfor %}

{% endfor -%}
"""
footer = """
<!-- generated by git-cliff -->
"""
trim = true
render_always = true

[tool.git-cliff.git]
conventional_commits = true
filter_unconventional = false
require_conventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
fail_on_unmatched_commit = false
tag_pattern = "v[0-9].*"
topo_order = false
topo_order_commits = true
sort_commits = "newest"
recurse_submodules = false
commit_preprocessors = [
  { pattern = "\\((#([0-9]+))\\)", replace = "([#${3}](https://github.com/txfs19260817/tomodachi-macrogen/issues/${3}))" },
]
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^doc", group = "<!-- 2 -->Documentation" },
  { message = "^perf", group = "<!-- 3 -->Performance" },
  { message = "^refactor", group = "<!-- 4 -->Refactoring" },
  { message = "^test", group = "<!-- 5 -->Tests" },
  { message = "^build|^ci|^chore", group = "<!-- 6 -->Build and Maintenance" },
  { message = ".*", group = "<!-- 7 -->Legacy Changes" },
]
